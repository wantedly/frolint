# This workflow creates a release PR if changesets is existing
# When the changesets PR is merged, it will create tags to Github and publish packages to GitHub Packages.
name: Create Release Pull Request

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      # registry-url / scope write the //npm.pkg.github.com/:_authToken line and the
      # @wantedly scope mapping that `changeset publish` needs.
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com
          scope: "@wantedly"

      - run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn build

      # Every package sets publishConfig.registry to https://npm.pkg.github.com,
      # so `yarn release` (changeset publish) publishes to GitHub Packages only.
      - name: Create Release Pull Request or Publish to GitHub Packages
        uses: changesets/action@v1
        with:
          publish: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
