# This workflow creates a release PR if changesets is existing
# When the changesets PR is merged, it will create tags to Github and publish packages.
name: Create Release Pull Request

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }} // TODO: 移行したら削除するs
  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v2
        with:
          node-version: 18.x

      - run: yarn install --frozen-lockfile
      - run: yarn lerna bootstrap
      - run: yarn build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_ACCESS_TOKEN }}
        with:
          publish: yarn release

  # Publish to GitHub Packages with @wantedly scope
  release-to-github-packages:
    runs-on: ubuntu-latest
    needs: create-release-pr
    if: needs.create-release-pr.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2
        with:
          ref: master
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin master

      - name: Setup Node.js 18.x for GitHub Packages
        uses: actions/setup-node@v2
        with:
          node-version: 18.x
          registry-url: https://npm.pkg.github.com
          scope: '@wantedly'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Bootstrap
        run: yarn lerna bootstrap

      - name: Build
        run: yarn build

      - name: Update package names for GitHub Packages
        run: |
          for file in packages/*/package.json; do
            jq '.name = "@wantedly/" + (.name | gsub("^@wantedly/"; ""))' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "temp: change package names for GitHub Packages"

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn lerna publish from-package --yes --no-verify-access
