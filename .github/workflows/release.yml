# This workflow creates a release PR if changesets is existing
# When the changesets PR is merged, it will create tags to Github and publish packages.
name: Create Release Pull Request

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }} // TODO 移行後削除する
  GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - run: yarn install --frozen-lockfile
      - run: yarn lerna bootstrap
      - run: yarn build

      - name: Create Release Pull Request or Publish to GitHub Packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to npm without @wantedly scope
  release-to-npm:
    runs-on: ubuntu-latest
    needs: create-release-pr
    if: needs.create-release-pr.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin master

      - name: Setup Node.js 18.x for npm
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Bootstrap
        run: yarn lerna bootstrap

      - name: Build
        run: yarn build

      - name: Update package names for npm
        run: |
          for file in packages/*/package.json; do
            jq '
              .name = (.name | gsub("^@wantedly/"; "")) |
              if .dependencies then
                .dependencies = (.dependencies | with_entries(.key = (.key | gsub("^@wantedly/"; ""))))
              else . end |
              .publishConfig.registry = "https://registry.npmjs.org"
            ' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "temp: change package names for npm"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn lerna publish from-package --yes --no-verify-access
