# This workflow creates a release PR if changesets is existing
# When the changesets PR is merged, it will create tags to Github and publish packages.
name: Create Release Pull Request

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - run: yarn install --frozen-lockfile
      - run: yarn lerna bootstrap
      - run: yarn build

      # Point the registry at GitHub Packages only for publishing. Doing it before
      # the install above would resolve the public dependencies from there as well.
      - name: Setup Node.js 18.x for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          registry-url: https://npm.pkg.github.com
          scope: "@wantedly"

      - name: Create Release Pull Request or Publish to GitHub Packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to npm without @wantedly scope
  release-to-npm:
    runs-on: ubuntu-latest
    needs: create-release-pr
    if: needs.create-release-pr.outputs.published == 'true'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin master

      - name: Setup Node.js 18.x for npm
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Bootstrap
        run: yarn lerna bootstrap

      - name: Build
        run: yarn build

      # Strip the @wantedly scope everywhere it appears, not just from the package
      # names: the built output and the shipped configs require each other by name.
      - name: Update package names for npm
        run: |
          grep -rl '@wantedly/' packages \
            --include='*.js' --include='*.d.ts' --include='*.json' --exclude-dir=node_modules |
            xargs -r sed -i 's|@wantedly/||g'
          for file in packages/*/package.json; do
            jq '.publishConfig.registry = "https://registry.npmjs.org"' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "temp: change package names for npm"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn lerna publish from-package --yes --no-verify-access
